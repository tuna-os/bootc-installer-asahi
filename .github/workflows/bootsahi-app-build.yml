name: bootsahi-app-build

# D3 skeleton was written with no Swift toolchain / macOS host available;
# nothing in macos-app/Bootsahi had ever been compiled. This uses GitHub's
# macOS runners (free/unmetered on this public repo) to get real compiler
# feedback before James tests on his own Mac — manual dispatch only
# ("use macOS runners sparingly" per project convention), not on every push.

on:
  workflow_dispatch:
  push:
    # feat/d3-bootsahi-app-skeleton is merged and dead; main is where the app
    # actually changes now. Without main here the Swift suite had no automatic
    # gate at all — it only ran when manually dispatched, and it is now SKIPped
    # on CLT-only Macs (no XCTest), so local runs don't cover it either. This
    # suite has already caught something reasoning alone did not: the Swift 6
    # "reference to captured var 'self' in concurrently-executing code" error.
    # The paths filter keeps macOS-runner use sparing — the app changes rarely.
    branches: [main, feat/d3-bootsahi-app-skeleton]
    paths: ["macos-app/**"]
  # ...and on PRs that touch the app, or the gate arrives too late to be one.
  # Running only on push-to-main means a Swift change is compile-checked AFTER
  # it has already landed: the first sign of a break is a red main, not a red
  # PR. That is exactly what happened to the change that added this trigger —
  # fields were removed from InstallConfig and OptionsView with nothing
  # verifying the app still built.
  #
  # The same paths filter applies, so macOS-runner use stays sparing: PRs that
  # do not touch macos-app/ still cost nothing.
  pull_request:
    paths: ["macos-app/**"]

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos-app/Bootsahi
    steps:
      - uses: actions/checkout@v6
      - name: swift --version
        run: swift --version
      - name: swift build
        run: swift build -v
      - name: swift test
        run: swift test -v

  # Regenerates docs/screenshots/*.png and the README walkthrough animation from
  # the real SwiftUI views. Two things this buys beyond pretty docs:
  #
  #  1. Design review on a PR. A layout regression — text clipped at the window
  #     edge, a control that reflows badly — is invisible in a diff and obvious
  #     in an image. The artifact is downloadable from every PR that touches the
  #     app, so the change can be looked at rather than imagined.
  #  2. Docs that cannot silently rot. Hand-taken screenshots drift from the app
  #     the moment anyone edits a view, and nothing ever tells you. These are
  #     rebuilt from the source they document.
  #
  # Runs on the SAME runner as the build, after it, because a screenshot of code
  # that does not compile is not a thing that can exist.
  screenshots:
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    defaults:
      run:
        working-directory: macos-app/Bootsahi
    steps:
      - uses: actions/checkout@v6
      - name: capture every screen
        env:
          BOOTSAHI_CAPTURE_DIR: ${{ github.workspace }}/docs/screenshots
        run: swift test --filter ScreenshotCaptureTests
      # The capture test SKIPS itself when BOOTSAHI_CAPTURE_DIR is unset, and a
      # skipped XCTest still exits 0. Without this check a broken capture would
      # publish a green tick and an unchanged, stale set of images — the failure
      # mode being fixed, reintroduced by the fix.
      - name: assert the capture actually produced files
        run: |
          cd "$GITHUB_WORKSPACE/docs/screenshots"
          missing=0
          for f in 01-welcome 02-choose-image 03-settings 04-disk-space \
                   05-installing 06-recoveryos; do
            if [ ! -s "$f.png" ]; then echo "::error::missing or empty $f.png"; missing=1; fi
          done
          [ -s walkthrough.gif ] || { echo "::error::missing walkthrough.gif"; missing=1; }
          exit "$missing"
      # if: always() because the audit step above FAILS when a screen renders
      # wrong — which is exactly when someone needs to look at the picture. The
      # first version skipped the upload on failure, so a capture bug could only
      # be diagnosed from ratios with no way to see what they described.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots
          path: docs/screenshots/
      # Only main commits them. On a PR the artifact is the deliverable: pushing
      # generated images back into a contributor's branch rewrites their history
      # for a file they did not touch.
      - name: commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no screenshot changes"
            exit 0
          fi
          # Byte-level comparison, deliberately. Rendering is not guaranteed
          # reproducible across OS and font revisions, so a runner-image bump can
          # produce a commit that changes only antialiasing. That churn is the
          # cheaper failure: the alternative — a size or perceptual tolerance —
          # silently drops small real regressions, and a screenshot rig that
          # hides changes is worse than one that is occasionally chatty.
          # [skip ci] stops this commit from triggering another run of itself.
          git commit -m "docs: refresh GUI screenshots [skip ci]"
          git push

  # The Liquid Glass surface in WizardChrome.swift is behind `#if
  # compiler(>=6.2)` because glassEffect needs the macOS 26 SDK to COMPILE, not
  # merely macOS 26 to run. On the macos-14 runner above that branch is excluded
  # by the preprocessor — which means the job above cannot tell you whether it
  # builds. Code that no CI configuration ever compiles is the same "gate that
  # never fires" shape this repo has been fixing all along, so it gets a runner
  # that actually reaches it.
  #
  # timeout-minutes is the important bit: if the macos-26 label does not resolve
  # in this org, the job would otherwise sit queued indefinitely and look like a
  # slow build rather than a missing runner. Failing after 20 minutes says so.
  build-tahoe:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: macos-app/Bootsahi
    steps:
      - uses: actions/checkout@v6
      - name: swift --version
        run: swift --version
      # Proves the compiler gate is actually open here — otherwise a silently
      # older toolchain would give a green check for a build that skipped the
      # very code this job exists to compile.
      - name: assert the Tahoe SDK path is live
        run: |
          cat > /tmp/gatecheck.swift <<'EOF'
          #if compiler(>=6.2)
          print("GLASS_PATH_COMPILED")
          #else
          print("GLASS_PATH_SKIPPED")
          #endif
          EOF
          out=$(swift /tmp/gatecheck.swift)
          echo "$out"
          if [ "$out" != "GLASS_PATH_COMPILED" ]; then
            echo "::error::macos-26 runner is not on a Swift 6.2+ toolchain, so the"
            echo "::error::Liquid Glass branch was NOT compiled. This job would be"
            echo "::error::reporting green for code it never looked at."
            exit 1
          fi
      - name: swift build
        run: swift build -v
      - name: swift test
        run: swift test -v
