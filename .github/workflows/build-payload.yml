name: Build asahi-installer payload

# D0 of docs/DESIGN.md: package a bootc aarch64 image as an asahi-installer
# payload (esp/ + root.img zip + installer_data.json). Dispatch against any
# asahi-capable image; artifact-only until R2 credentials are wired.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to package. Default is the bootsahi BOOTSTRAP — a stock desktop image boots but cannot install (issue #27)."
        default: "ghcr.io/tuna-os/bootsahi-bootstrap:latest"
        type: string
      require_bootstrap:
        description: "Fail if the image is not a bootsahi bootstrap (no agent/unit/fisherman inside)"
        default: true
        type: boolean
      name:
        description: "Payload name"
        default: "tunaos-bootstrap"
        type: string
      bootstrap_size_gb:
        description: "Bootstrap partition size (GB) — the loopback disk root.img is built in, NOT the installed system's disk"
        default: "24"
        type: string
      target_min_gb:
        description: "Minimum size (GB) of the expanding target partition the installed OS goes into"
        default: "12"
        type: string
      upload_r2:
        description: "Upload payload zip and installer_data.json to Cloudflare R2 (download.tunaos.org/asahi)"
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  payload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: sudo podman pull "${{ inputs.image }}"

      - name: Free up disk space
        # Desktop images need a 16G loopback disk + pulled layers + the
        # zipped payload; stock runners don't have the headroom.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build payload
        env:
          TARGET_MIN_GB: ${{ inputs.target_min_gb }}
        run: sudo -E ./scripts/make-payload.sh "${{ inputs.image }}" "${{ inputs.name }}" "${{ inputs.bootstrap_size_gb }}"

      - name: "Test: payload structure, boot chain, rootfs, installer_data"
        env:
          REQUIRE_BOOTSTRAP: ${{ inputs.require_bootstrap && '1' || '0' }}
        run: sudo -E ./scripts/test-payload.sh "out/${{ inputs.name }}.zip" out/installer_data.json

      - name: Install qemu + U-Boot firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils u-boot-qemu ipxe-qemu parted dosfstools

      - name: "Test: boot the reconstructed install (U-Boot EFI chain)"
        run: sudo ./scripts/test-boot-payload.sh "out/${{ inputs.name }}.zip"

      - name: Upload boot serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payload-boot-serial-${{ github.run_id }}
          path: serial-payload-boot.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload payload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-payload
          path: out/
          retention-days: 14

      - name: Upload payload to Cloudflare R2
        if: inputs.upload_r2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PAYLOAD_NAME: ${{ inputs.name }}
        run: |
          if [[ -z "${R2_BUCKET}" ]]; then
            echo "R2 secrets not configured — skipping publish"
            exit 0
          fi
          ZIP="out/${PAYLOAD_NAME}.zip"
          DATA="out/installer_data.json"
          [[ -f "$ZIP" ]] || { echo "::error::Payload zip not found"; exit 1; }
          [[ -f "$DATA" ]] || { echo "::error::installer_data.json not found"; exit 1; }
          echo "==> Uploading payload ($ZIP and $DATA) to R2..."
          rclone copy --log-level INFO --checksum --s3-no-check-bucket \
            "$ZIP" "R2:${R2_BUCKET}/asahi/"
          rclone copy --log-level INFO --checksum --s3-no-check-bucket \
            "$DATA" "R2:${R2_BUCKET}/asahi/"
          echo "==> Published payload to R2 bucket ${R2_BUCKET}/asahi/"

